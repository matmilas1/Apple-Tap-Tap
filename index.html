<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Apple TapTap</title>
    <link rel="stylesheet" href="menu.css?v=40">
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="menu.js?v=40" defer></script>
</head>
<body>

    <div class="github-container">
        <div class="github-logo-zone">
            <img src="images/Apple tap tap.png" class="github-logo" alt="Logo">
        </div>

        <div class="github-card">
            <div class="github-tabs">
                <div id="tab-login" class="github-tab active">Sign in</div>
                <div id="tab-register" class="github-tab">Sign up</div>
            </div>

            <div class="github-form">
                <div class="input-wrapper">
                    <label id="label-user" class="input-label">Username</label>
                    <input type="text" id="menu-username" class="github-input" placeholder="Username">
                </div>

                <div class="input-wrapper">
                    <label class="input-label">Password</label>
                    <input type="password" id="menu-password" class="github-input" placeholder="Password">
                </div>

                <button id="menu-auth-btn" class="github-btn">Sign in</button>
                <button id="menu-play-btn" class="github-btn play-btn" style="display: none;">Launch Game ▶️</button>
            </div>
        </div>

        <p id="menu-status-text" class="github-status">Please sign in or create an account to play beta.</p>
    </div>

</body>
</html>
