<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple TapTap - Main Menu</title>
    <link rel="stylesheet" href="menu.css">
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="menu.js?v=20" defer></script>
</head>
<body>

    <div class="menu-overlay">
        <div class="menu-content">
            <img src="images/Apple tap tap.png" class="menu-logo" alt="Apple Tap-Tap">
            
            <div class="auth-inputs">
                <input type="email" id="menu-email" class="menu-input" placeholder="Enter Email...">
                <input type="password" id="menu-password" class="menu-input" placeholder="Enter Password...">
            </div>

            <div class="menu-buttons">
                <button id="menu-login-btn" class="menu-btn play">Login / Sign Up 🍏</button>
                <button id="menu-play-btn" class="menu-btn google" disabled>Start Game ▶️</button>
            </div>
            
            <p id="menu-status-text">Please log in or register to play the beta!</p>
        </div>
    </div>

</body>
</html>
